services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sre-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./data/prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 512m
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sre-alertmanager
    restart: unless-stopped
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["127.0.0.1:9093:9093"]
    mem_limit: 128m
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sre-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/rootfs", "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]
    mem_limit: 128m
  loki:
    image: grafana/loki:3.3.2
    container_name: sre-loki
    restart: unless-stopped
    environment: ["GOMEMLIMIT=350MiB"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 512m
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: sre-alloy
    restart: unless-stopped
    environment: ["GOMEMLIMIT=150MiB"]
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./config/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    mem_limit: 256m
  grafana:
    image: grafana/grafana:11.4.0
    container_name: sre-grafana
    restart: unless-stopped
    environment: ["GF_SECURITY_ADMIN_USER=admin", "GF_SECURITY_ADMIN_PASSWORD=admin"]
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 384m
  manager:
    build: ./manager
    container_name: sre-manager
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./data/manager:/data
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 256m
